---
include:
  - https://salsa.debian.org/salsa-ci-team/pipeline/raw/master/salsa-ci.yml
  - https://salsa.debian.org/salsa-ci-team/pipeline/raw/master/pipeline-jobs.yml

variables:
  # https://manpages.debian.org/unstable/reprotest/reprotest.1.en.html#Domain_or_host
  SALSA_CI_REPROTEST_ARGS: --vary=domain_host.use_sudo=1
  SALSA_CI_REPROTEST_ENABLE_DIFFOSCOPE: 1
  SALSA_CI_ENABLE_BUILD_PACKAGE_PROFILES: 1

test-crossbuild-arm64:
  allow_failure: false

test-build-profiles:
  extends: .test-build-package-profiles
  parallel:
    matrix:
      - BUILD_PROFILES: nocheck
      - BUILD_PROFILES: nodoc
      - BUILD_PROFILES: pkg.hwloc.minimum

